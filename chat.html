<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf2" />
    <title>Chat with BaonBuddy</title>
    <link rel="icon" type="image/png" href="/erasebg-transformed.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Oi&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        font-family: Nunito, sans-serif;
        color: #382f22;
        background: #fffaf2;
        --ink: #382f22;
        --muted: #827666;
        --line: #eee5d4;
        --gold: #f3bb35;
        --gold-dark: #c98a12;
        --green: #64a84c;
        --green-dark: #3d7e36;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 22px;
        background-image: radial-gradient(#e9ddc9 0.7px, transparent 0.7px);
        background-size: 19px 19px;
      }
      button, input { font: inherit; }
      button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #65a84c66; outline-offset: 3px; }
      .chat-shell { width: min(1120px, 100%); margin: 0 auto; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
      .brand-home { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 900; }
      .brand-home img { width: 40px; height: 40px; object-fit: contain; }
      .brand-name { font-family: 'Oi', cursive; font-size: 1.05rem; font-weight: 400; }
      .streak-label { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border: 1px solid #f0dda7; border-radius: 999px; background: #fff5d5; color: #86641e; font-size: .82rem; font-weight: 900; }
      .page-heading { margin: 0 0 17px; }
      .page-heading h1 { margin: 0; font-size: 1.75rem; font-weight: 900; line-height: 1.15; }
      .page-heading p { margin: 5px 0 0; color: var(--muted); }
      .chat-layout { display: grid; min-height: min(690px, calc(100vh - 180px)); grid-template-columns: 260px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 16px 45px #604a2317; }
      .history-panel { display: flex; min-height: 0; flex-direction: column; border-right: 1px solid var(--line); background: #fffdf8; }
      .history-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 17px 14px 12px; }
      .history-heading h2 { margin: 0; font-size: .82rem; font-weight: 900; }
      .new-chat { display: inline-flex; min-height: 36px; align-items: center; justify-content: center; gap: 6px; padding: 7px 10px; border: 1px solid #d5e7cc; border-radius: 11px; background: #eff8e9; color: var(--green-dark); font-size: .76rem; font-weight: 900; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
      .new-chat:hover { transform: translateY(-2px); background: #e4f3da; box-shadow: 0 4px 0 #c6dfb8; }
      .new-chat:active { transform: translateY(1px) scale(.97); box-shadow: none; }
      #history-list { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 5px; padding: 2px 9px 12px; overflow-y: auto; }
      .history-row { display: flex; min-width: 0; align-items: center; gap: 3px; padding: 3px; border-radius: 12px; }
      .history-row.active { background: #f4eddd; }
      .history-select { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; padding: 8px 7px; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
      .history-title { overflow: hidden; font-size: .79rem; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
      .history-date { color: #948a79; font-size: .67rem; font-weight: 700; }
      .delete-chat { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 9px; background: transparent; color: #968b7e; font-size: 1.1rem; cursor: pointer; transition: background .16s ease, color .16s ease, transform .16s ease; }
      .delete-chat:hover { transform: scale(1.08); background: #ffebe3; color: #b94a36; }
      .history-empty { margin: 8px 6px; color: var(--muted); font-size: .76rem; line-height: 1.45; }
      .history-note { margin: auto 13px 13px; padding-top: 10px; border-top: 1px solid var(--line); color: #968b7d; font-size: .68rem; line-height: 1.45; }
      .conversation-panel { display: flex; min-width: 0; min-height: 0; flex-direction: column; }
      .conversation-heading { display: flex; min-height: 61px; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 19px; border-bottom: 1px solid #f1ece2; }
      #conversation-title { min-width: 0; margin: 0; overflow: hidden; font-size: .96rem; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
      .buddy-tag { flex: 0 0 auto; color: var(--green-dark); font-size: .74rem; font-weight: 900; }
      #messages { display: flex; min-height: 300px; flex: 1; flex-direction: column; gap: 13px; padding: 21px clamp(14px, 4vw, 36px); overflow-y: auto; scroll-behavior: smooth; }
      .bubble { max-width: min(82%, 540px); padding: 12px 15px; border-radius: 17px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; animation: message-in .24s ease both; }
      .bubble.assistant { align-self: flex-start; border: 1px solid #e8efd9; border-bottom-left-radius: 5px; background: #f3f8e9; }
      .bubble.user { align-self: flex-end; border: 1px solid #efd48a; border-bottom-right-radius: 5px; background: #fff2c6; }
      .welcome { display: flex; max-width: 430px; flex-direction: column; align-items: center; align-self: center; margin: auto; padding: 18px; text-align: center; animation: message-in .38s ease both; }
      .welcome-mascot { display: grid; width: 88px; height: 88px; margin-bottom: 11px; place-items: center; border: 5px solid #fff; border-radius: 30px; background: #f4dc8c; box-shadow: 0 5px 0 #e5c76c; transform: rotate(-4deg); }
      .welcome-mascot img { width: 74px; height: 74px; object-fit: contain; }
      .welcome .eyebrow { margin: 0 0 4px; color: var(--green-dark); font-size: .68rem; font-weight: 900; letter-spacing: .1em; }
      .welcome h2 { margin: 0; font-size: 1.35rem; font-weight: 900; }
      .welcome p { margin: 6px 0 16px; color: var(--muted); font-size: .87rem; line-height: 1.5; }
      .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      .suggestion { padding: 8px 11px; border: 1px solid #e8e1d1; border-radius: 999px; background: #fff; color: #665c4d; font-size: .75rem; font-weight: 800; cursor: pointer; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
      .suggestion:hover { transform: translateY(-2px); border-color: #bad6aa; background: #f5faef; }
      .composer { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-top: 1px solid #f1ece2; background: #fff; }
      #message { min-width: 0; min-height: 47px; flex: 1; padding: 11px 14px; border: 1.5px solid #e6dfd0; border-radius: 14px; background: #fffefa; color: var(--ink); }
      #message::placeholder { color: #a69b88; }
      #message:focus { border-color: #8eb873; outline: 3px solid #78ad5c24; }
      #send { display: inline-flex; min-width: 98px; min-height: 47px; align-items: center; justify-content: center; gap: 8px; padding: 10px 15px; border: 0; border-radius: 14px; background: var(--green); color: #fff; font-weight: 900; box-shadow: 0 4px 0 var(--green-dark); cursor: pointer; transition: transform .17s ease, box-shadow .17s ease, background .17s ease; }
      #send:hover:not(:disabled) { transform: translateY(-2px); background: #579644; box-shadow: 0 6px 0 var(--green-dark); }
      #send:active:not(:disabled), #send.pulse { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 var(--green-dark); }
      #send:disabled { cursor: wait; opacity: .8; }
      .send-icon { font-size: 1.1rem; line-height: 1; transition: transform .2s ease; }
      #send:hover:not(:disabled) .send-icon { transform: translate(2px, -2px); }
      #status { min-height: 23px; padding: 0 20px 8px; color: var(--muted); font-size: .77rem; }
      #storage-status { min-height: 17px; padding: 0 20px 8px; color: #a34a37; font-size: .72rem; }
      .safety-note { margin: 12px 3px 0; color: #8d8272; font-size: .76rem; line-height: 1.5; }
      @keyframes message-in { from { opacity: 0; transform: translateY(7px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes button-pop { 0% { transform: scale(1); } 45% { transform: scale(.93); } 100% { transform: scale(1); } }
      #send.pulse { animation: button-pop .25s ease; }
      @media (max-width: 700px) {
        body { padding: 12px; }
        .topbar { margin-bottom: 15px; }
        .chat-layout { min-height: calc(100dvh - 175px); grid-template-columns: 1fr; }
        .history-panel { max-height: 156px; border-right: 0; border-bottom: 1px solid var(--line); }
        .history-heading { padding: 10px 12px 6px; }
        #history-list { flex: 0 0 auto; flex-direction: row; padding: 0 9px 9px; overflow-x: auto; overflow-y: hidden; }
        .history-row { width: 190px; flex: 0 0 auto; }
        .history-note { display: none; }
        .conversation-heading { min-height: 52px; padding: 10px 14px; }
        #messages { min-height: 260px; padding: 16px 13px; }
        .bubble { max-width: 91%; }
        .composer { gap: 7px; padding: 10px; }
        #message { min-height: 45px; padding-inline: 11px; }
        #send { min-width: 49px; padding: 10px 12px; }
        .send-label { display: none; }
        #status, #storage-status { padding-inline: 13px; }
      }
      @media (max-width: 380px) {
        .brand-home { gap: 6px; font-size: .86rem; }
        .brand-home img { width: 34px; height: 34px; }
        .streak-label { padding: 7px 9px; font-size: .72rem; }
        .page-heading h1 { font-size: 1.5rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="chat-shell">
      <header class="topbar">
        <a class="brand-home" href="/" aria-label="Back to BaonBuddy home">
          <img src="/erasebg-transformed.png" alt="" />
          <span>Back to BaonBuddy</span>
        </a>
        <span class="streak-label"><span aria-hidden="true">✦</span> Money buddy</span>
      </header>
      <div class="page-heading">
        <h1>Let’s talk money!</h1>
        <p>Small questions can lead to big money wins.</p>
      </div>
      <div class="chat-layout">
        <aside class="history-panel" aria-label="Chat history">
          <div class="history-heading">
            <h2>YOUR CHATS</h2>
            <button id="new-chat" class="new-chat" type="button"><span aria-hidden="true">＋</span> New chat</button>
          </div>
          <div id="history-list" role="list" aria-label="Saved conversations"></div>
          <p class="history-note">Your chat history is saved in this browser.</p>
        </aside>
        <section class="conversation-panel" aria-label="BaonBuddy chat">
          <div class="conversation-heading">
            <h2 id="conversation-title">Money buddy</h2>
            <span class="buddy-tag">● Here to help</span>
          </div>
          <div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
          <form id="chat-form" class="composer">
            <label for="message" hidden>Your message</label>
            <input id="message" name="message" type="text" maxlength="2000" placeholder="Ask about your baon…" autocomplete="off" required />
            <button id="send" type="submit"><span class="send-label">Send</span><span class="send-icon" aria-hidden="true">↑</span></button>
          </form>
          <div id="status" role="status" aria-live="polite"></div>
          <div id="storage-status" role="status" aria-live="polite"></div>
        </section>
      </div>
      <p class="safety-note">AI replies are general information, not professional financial advice. Don’t share passwords or account details.</p>
    </main>
    <script>
      const STORAGE_KEY = "baonbuddy-chat-conversations";
      const form = document.getElementById("chat-form");
      const input = document.getElementById("message");
      const messages = document.getElementById("messages");
      const status = document.getElementById("status");
      const storageStatus = document.getElementById("storage-status");
      const send = document.getElementById("send");
      const historyList = document.getElementById("history-list");
      const conversationTitle = document.getElementById("conversation-title");
      const newChatButton = document.getElementById("new-chat");
      let conversations = loadConversations();
      let activeConversationId = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt)[0]?.id;
      let isSending = false;

      function createConversation() {
        return { id: crypto.randomUUID?.() || `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`, title: "New chat", createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
      }

      function loadConversations() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(saved)) return [createConversation()];
          const loaded = saved.filter((chat) => chat && typeof chat.id === "string" && Array.isArray(chat.messages)).map((chat) => ({
            id: chat.id,
            title: typeof chat.title === "string" ? chat.title.slice(0, 64) : "New chat",
            createdAt: Number(chat.createdAt) || Date.now(),
            updatedAt: Number(chat.updatedAt) || Date.now(),
            messages: chat.messages.filter((message) => message && ["user", "assistant"].includes(message.role) && typeof message.text === "string").map((message) => ({ role: message.role, text: message.text.slice(0, 12000) }))
          }));
          return loaded.length ? loaded : [createConversation()];
        } catch {
          return [createConversation()];
        }
      }

      function saveConversations() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
          storageStatus.textContent = "";
          return true;
        } catch {
          storageStatus.textContent = "Couldn’t save chat history. Your browser storage may be full or unavailable.";
          return false;
        }
      }

      function activeConversation() {
        return conversations.find((chat) => chat.id === activeConversationId);
      }

      function formatDate(timestamp) {
        const date = new Date(timestamp);
        const today = new Date();
        if (date.toDateString() === today.toDateString()) return "Today";
        return new Intl.DateTimeFormat("en", { month: "short", day: "numeric" }).format(date);
      }

      function renderHistory() {
        historyList.replaceChildren();
        const sorted = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt);
        if (!sorted.length) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "Your conversations will show up here.";
          historyList.appendChild(empty);
          return;
        }
        sorted.forEach((chat) => {
          const row = document.createElement("div");
          row.className = `history-row${chat.id === activeConversationId ? " active" : ""}`;
          row.setAttribute("role", "listitem");
          const select = document.createElement("button");
          select.type = "button";
          select.className = "history-select";
          select.disabled = isSending;
          select.setAttribute("aria-current", chat.id === activeConversationId ? "true" : "false");
          const title = document.createElement("span");
          title.className = "history-title";
          title.textContent = chat.title;
          const date = document.createElement("span");
          date.className = "history-date";
          date.textContent = formatDate(chat.updatedAt);
          select.append(title, date);
          select.addEventListener("click", () => {
            activeConversationId = chat.id;
            render();
          });
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-chat";
          remove.disabled = isSending;
          remove.textContent = "×";
          remove.setAttribute("aria-label", `Delete ${chat.title}`);
          remove.title = "Delete chat";
          remove.addEventListener("click", () => deleteConversation(chat));
          row.append(select, remove);
          historyList.appendChild(row);
        });
      }

      function appendBubble(text, role) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;
        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;
      }

      function renderWelcome() {
        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.innerHTML = '<div class="welcome-mascot"><img src="/erasebg-transformed.png" alt="" /></div><p class="eyebrow">YOUR MONEY SIDEKICK</p><h2>What’s on your mind?</h2><p>We can make a simple plan for your baon, spending, or savings goals.</p><div class="suggestions"><button class="suggestion" type="button">Help me save my baon</button><button class="suggestion" type="button">Make a simple budget</button><button class="suggestion" type="button">I want to save for something</button></div>';
        welcome.querySelectorAll(".suggestion").forEach((button) => button.addEventListener("click", () => sendMessage(button.textContent)));
        messages.appendChild(welcome);
      }

      function renderConversation() {
        const chat = activeConversation();
        if (!chat) return;
        conversationTitle.textContent = chat.title === "New chat" ? "Money buddy" : chat.title;
        messages.replaceChildren();
        if (!chat.messages.length) renderWelcome();
        else chat.messages.forEach((message) => appendBubble(message.text, message.role));
      }

      function render() {
        renderHistory();
        renderConversation();
      }

      function deleteConversation(chat) {
        if (!window.confirm(`Delete “${chat.title}” and its messages? This can’t be undone.`)) return;
        conversations = conversations.filter((entry) => entry.id !== chat.id);
        if (activeConversationId === chat.id) {
          conversations.sort((a, b) => b.updatedAt - a.updatedAt);
          activeConversationId = conversations[0]?.id;
        }
        if (!conversations.length) {
          const fresh = createConversation();
          conversations.push(fresh);
          activeConversationId = fresh.id;
        }
        saveConversations();
        render();
      }

      async function sendMessage(rawMessage) {
        const message = rawMessage.trim();
        const chat = activeConversation();
        if (!message || !chat || isSending) return;
        isSending = true;
        input.disabled = true;
        send.disabled = true;
        send.setAttribute("aria-busy", "true");
        newChatButton.disabled = true;
        status.textContent = "BaonBuddy is thinking…";
        renderHistory();
        appendBubble(message, "user");
        const pending = document.createElement("div");
        pending.className = "bubble assistant";
        pending.textContent = "Thinking…";
        messages.appendChild(pending);
        messages.scrollTop = messages.scrollHeight;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message,
              history: chat.messages.slice(-10).map((turn) => ({ role: turn.role === "assistant" ? "model" : "user", text: turn.text }))
            })
          });
          const responseText = await response.text();
          if (!responseText.trim()) {
            const error = response.status === 504
              ? "The chat server timed out. Please try again."
              : `The chat server returned an empty response (HTTP ${response.status}). Please check the server and try again.`;
            throw new Error(error);
          }
          let data;
          try { data = JSON.parse(responseText); }
          catch { throw new Error(`The chat server returned an invalid response (HTTP ${response.status}). Please check the server and try again.`); }
          if (!response.ok) throw new Error(data.error || "The chat request failed.");
          if (typeof data.response !== "string" || !data.response.trim()) throw new Error("The chat server returned an empty answer. Please try again.");

          pending.textContent = data.response;
          chat.messages.push({ role: "user", text: message }, { role: "assistant", text: data.response });
          if (chat.title === "New chat") chat.title = message.slice(0, 48) || "New chat";
          conversationTitle.textContent = chat.title;
          chat.updatedAt = Date.now();
          input.value = "";
          status.textContent = "";
          saveConversations();
        } catch (error) {
          pending.remove();
          messages.lastElementChild?.remove();
          status.textContent = error.message || "Could not send your message. Please try again.";
        } finally {
          isSending = false;
          input.disabled = false;
          send.disabled = false;
          send.removeAttribute("aria-busy");
          newChatButton.disabled = false;
          renderHistory();
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        send.classList.remove("pulse");
        void send.offsetWidth;
        send.classList.add("pulse");
        sendMessage(input.value);
      });
      newChatButton.addEventListener("click", () => {
        const chat = createConversation();
        conversations.push(chat);
        activeConversationId = chat.id;
        status.textContent = "";
        saveConversations();
        render();
        input.focus();
      });
      render();
    </script>
  </body>
</html>
