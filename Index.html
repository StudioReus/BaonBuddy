<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="page-header">
      <h1>Budget Tracker</h1>
      <p>Track your income, expenses, and savings.</p>
    </header>

    <section class="dashboard">
      <div class="card income">
        <h2>Total Income</h2>
        <p>$0.00</p>
      </div>

      <div class="card expenses">
        <h2>Total Expenses</h2>
        <p>$0.00</p>
      </div>

      <div class="card balance">
        <h2>Remaining Balance</h2>
        <p>$0.00</p>
      </div>
    </section>

    <section class="entry-form">
      <h2>Add Transaction</h2>

      <form>
        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <label for="category">Category</label>
        <input id="category" name="category" type="text" placeholder="Food, Rent, Salary..." />

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" step="0.01" min="0" placeholder="0.00" />

        <label for="date">Date</label>
        <input id="date" name="date" type="date" />

        <button type="submit">Save</button>
      </form>
    </section>

    <section class="history">
      <h2>Recent Transactions</h2>
      <ul>
        <li>Salary - $2500.00</li>
        <li>Groceries - $120.50</li>
        <li>Rent - $900.00</li>
      </ul>
    </section>
  </main>
</body>
</html>
